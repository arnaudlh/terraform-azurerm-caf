name: PR mock-tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'examples/tests/**'
      - '.github/workflows/pr_tests-mock.yaml'

env:
  TF_VERSION: "1.8.4"
  TF_LINT_VERSION: "v0.50.3"

jobs:
  run_component_tests:
    name: Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >>"$GITHUB_ENV"
          mkdir --parents "$HOME/.terraform.d/plugin-cache"

      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        id: tf_init
        run: |
          terraform -chdir=examples \
          init

      - name: Run Compute Component Tests
        id: compute_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/component_tests \
          -filter=compute_tests.tftest.hcl \
          -verbose

      - name: Run Networking Component Tests
        id: networking_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/component_tests \
          -filter=networking_tests.tftest.hcl \
          -verbose

      - name: Run Azure AD Component Tests
        id: azuread_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/component_tests \
          -filter=azuread_tests.tftest.hcl \
          -verbose

      - name: Run Data Platform Component Tests
        id: data_platform_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/component_tests \
          -filter=data_platform_tests.tftest.hcl \
          -verbose

      - name: Run Security Component Tests
        id: security_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/component_tests \
          -filter=security_tests.tftest.hcl \
          -verbose

  run_integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: run_component_tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >>"$GITHUB_ENV"
          mkdir --parents "$HOME/.terraform.d/plugin-cache"

      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        id: tf_init
        run: |
          terraform -chdir=examples \
          init

      - name: Run Compute-Networking Integration Tests
        id: compute_networking_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/integration_tests \
          -filter=compute_networking_integration.tftest.hcl \
          -verbose

      - name: Run Data-Security Integration Tests
        id: data_security_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/integration_tests \
          -filter=data_security_integration.tftest.hcl \
          -verbose

  run_validation_tests:
    name: Validation Tests
    runs-on: ubuntu-latest
    needs: run_integration_tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >>"$GITHUB_ENV"
          mkdir --parents "$HOME/.terraform.d/plugin-cache"

      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        id: tf_init
        run: |
          terraform -chdir=examples \
          init

      - name: Run Variable Validation Tests
        id: variable_validation_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/validation_tests \
          -filter=variable_validation.tftest.hcl \
          -verbose

      - name: Run Output Validation Tests
        id: output_validation_tests
        run: |
          terraform -chdir=examples \
          test \
          -test-directory=./tests/mock/validation_tests \
          -filter=output_validation.tftest.hcl \
          -verbose
